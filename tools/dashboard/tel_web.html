<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robocar dashboard</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1d2228; --muted: #5d6670; --line: #d9dde2;
  --measured: #1f7a3a; --derived: #1d5fa8; --reported: #6b3fa0; --simulated: #b25e00; --na: #6d747c;
  --pass: #1f7a3a; --fail: #b3261e; --warn: #9a6700;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #15181c; --panel: #1e2227; --text: #e6e8eb; --muted: #9aa3ad; --line: #343a42;
    --measured: #5ccf7d; --derived: #6aa8ff; --reported: #b48cf0; --simulated: #f0a050; --na: #8b939c;
    --pass: #5ccf7d; --fail: #ff7b72; --warn: #e3b341; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
header { padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
h1 { font-size: 17px; margin: 0 0 8px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 4px 0; }
.group { display: flex; gap: 6px; align-items: center; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; }
input, select, button { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; }
select { max-width: 360px; }
button { cursor: pointer; }
button:disabled { opacity: .45; cursor: default; }
.pill { padding: 2px 8px; border-radius: 10px; border: 1px solid var(--line); font-size: 13px; }
.pill.ok { color: var(--pass); border-color: var(--pass); }
.pill.bad { color: var(--fail); border-color: var(--fail); }
.pill.warn { color: var(--warn); border-color: var(--warn); }
#err { color: var(--fail); }
nav { display: flex; flex-wrap: wrap; gap: 2px; padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
nav button { border: none; border-bottom: 3px solid transparent; border-radius: 0; background: none; padding: 8px 10px; }
nav button.on { border-bottom-color: var(--derived); font-weight: 600; }
main { padding: 12px 16px; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
@media (max-width: 900px) { .cols { grid-template-columns: minmax(0, 1fr); } }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px; min-width: 0; }
h2 { font-size: 14px; margin: 0 0 8px; }
table { border-collapse: collapse; width: 100%; }
td, th { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: 12px; }
td.val { font-family: ui-monospace, Consolas, monospace; white-space: nowrap; }
.note { color: var(--muted); font-size: 12px; }
.badge { font-size: 11px; font-weight: 700; letter-spacing: .03em; padding: 1px 6px; border-radius: 3px; border: 1px solid currentColor; white-space: nowrap; }
.MEASURED { color: var(--measured); } .DERIVED { color: var(--derived); } .REPORTED { color: var(--reported); }
.SIMULATED { color: var(--simulated); } .NA { color: var(--na); }
pre.feed { margin: 0; max-height: 420px; overflow: auto; font: 12px/1.35 ui-monospace, Consolas, monospace; white-space: pre-wrap; word-break: break-word; }
.res { font-weight: 700; white-space: nowrap; }
.res.PASS { color: var(--pass); } .res.FAIL { color: var(--fail); } .res.other { color: var(--warn); }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--muted); }
ol { margin: 4px 0 0 18px; padding: 0; }
</style>
</head>
<body>
<header>
  <h1>Robocar dashboard</h1>
  <div class="row">
    <div class="group"><b>Log</b>
      <select id="logSel"><option value="">(choose a log)</option></select>
      <label><input type="checkbox" id="follow"> follow</label>
      <button id="openBtn">Open</button><button id="refreshBtn" title="Refresh the list">&#x21bb;</button>
    </div>
    <div class="group"><b>USB</b> (Windows)
      <input id="usbMin" type="number" value="30" min="1" max="240" style="width:4.5em"> min
      <button id="usbBtn">Start capture</button>
    </div>
    <div class="group"><b>MQTT</b>
      <input id="broker" placeholder="broker IP" style="width:9em">
      <input id="port" type="number" value="1883" style="width:5em">
      <button id="mqttBtn">Connect</button>
    </div>
    <button id="stopBtn">Stop source</button>
  </div>
  <div class="row" id="pills"></div>
  <div class="row"><span id="err"></span></div>
  <div class="legend">
    <span><span class="badge MEASURED">MEASURED</span> read from a sensor</span>
    <span><span class="badge DERIVED">DERIVED</span> computed from measurements</span>
    <span><span class="badge REPORTED">REPORTED</span> state or decision from the firmware</span>
    <span><span class="badge SIMULATED">SIMULATED</span> written by a self-test</span>
    <span><span class="badge NA">N/A</span> not available</span>
  </div>
</header>
<nav id="tabs"></nav>
<main>
  <div class="cols">
    <div>
      <section><h2>Readings</h2><table><thead><tr><th>Reading</th><th>Value</th><th>Source</th><th>Note</th></tr></thead><tbody id="readings"></tbody></table></section>
      <section id="testBox" style="margin-top:12px"></section>
    </div>
    <section><h2 id="feedTitle">Events</h2><pre class="feed" id="feed"></pre></section>
  </div>
</main>
<script>
"use strict";
const TABS = [
  ["imu", "IMU"], ["obstacle", "Obstacle"], ["lf", "Line following"], ["barcode", "Barcode"],
  ["vc", "Vehicle Controller"], ["mqtt", "MQTT"], ["console", "Console"]
];
const PROC = {
  imu: ["Stationary firmware; car flat and still for 30 s after boot.",
        "Lift the FRONT about 15 deg (front wheels on a 4 cm book), hold 3 s, put it down. Pitch should go positive.",
        "Lift the LEFT side about 15 deg, hold 3 s, put it down. Note the sign of roll.",
        "Last: lift the whole car about 5 cm, hold 1 s, put it down. Expect LIFTED and BRAKE (latched until replug)."],
  obstacle: ["Stationary firmware; nothing within 60 cm in front or to the sides for 20 s.",
             "Box straight ahead at 50 cm from the sensor face, 15 s.",
             "Box at 20 cm, 15 s (inside 25 cm: an obstacle profile).",
             "Remove the box, 15 s. Enter the tape-measured distances and box width, then run the check."],
  mqtt: ["WiFi build (-DTEL_BACKEND_WIFI=ON, config/secrets.h) and a broker on this network.",
         "Connect above; let it run at least 30 s; run the check (heartbeat delivery and gaps)."]
};
const FEED_LIMIT = 1500;
let tab = "imu", seq = 0, gen = -1, feeds = {}, lastState = null, mqttUp = false;
for (const [k] of TABS) feeds[k] = [];

const $ = (id) => document.getElementById(id);
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) { if (k === "class") e.className = v; else e.setAttribute(k, v); }
  for (const c of kids) e.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return e;
}
async function api(path, body) {
  const opt = body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
  const r = await fetch(path, opt);
  const j = await r.json().catch(() => ({ error: "bad reply" }));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
function showErr(e) { $("err").textContent = e ? String(e.message || e) : ""; }
function resetFeeds() { seq = 0; for (const k in feeds) feeds[k] = []; renderFeed(); }

function renderTabs() {
  const nav = $("tabs"); nav.textContent = "";
  for (const [k, name] of TABS) {
    const b = el("button", { class: k === tab ? "on" : "" }, name);
    b.onclick = () => { tab = k; history.replaceState(null, "", "#" + k); renderTabs(); renderAll(); };
    nav.append(b);
  }
}
function badge(kind) { return el("span", { class: "badge " + (kind === "N/A" ? "NA" : kind) }, kind); }
function renderReadings() {
  const tb = $("readings"); tb.textContent = "";
  const rows = (lastState && lastState.readings[tab]) || [];
  if (tab === "console") { tb.append(el("tr", {}, el("td", { colspan: 4, class: "note" }, "Every raw line from the source, newest at the bottom."))); return; }
  for (const r of rows) tb.append(el("tr", {}, el("td", {}, r.name), el("td", { class: "val" }, r.value || "—"), el("td", {}, badge(r.kind)), el("td", { class: "note" }, r.note)));
}
function renderFeed() {
  const pre = $("feed");
  const atBottom = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 30;
  $("feedTitle").textContent = tab === "console" ? "Console (raw)" : "Events";
  pre.textContent = feeds[tab].join("\n") || "(nothing yet)";
  if (atBottom) pre.scrollTop = pre.scrollHeight;
}
function renderTest() {
  const box = $("testBox"); box.textContent = "";
  const hasCheck = ["imu", "obstacle", "mqtt"].includes(tab);
  if (PROC[tab]) { box.append(el("h2", {}, "Test procedure")); const ol = el("ol"); for (const s of PROC[tab]) ol.append(el("li", {}, s)); box.append(ol); }
  if (tab === "mqtt") {
    const row = el("div", { class: "row" });
    const stopB = el("button", {}, "Send STOP"), resetB = el("button", {}, "Send RESET");
    stopB.disabled = resetB.disabled = !mqttUp;
    stopB.onclick = () => api("/api/cmd", { cmd: "stop" }).then(() => showErr("")).catch(showErr);
    resetB.onclick = () => api("/api/cmd", { cmd: "reset" }).then(() => showErr("")).catch(showErr);
    row.append(stopB, resetB, el("span", { class: "note" }, "No START here: it drives the motors. Use the CLI with --allow-motion."));
    box.append(row);
  }
  if (!hasCheck) { box.style.display = PROC[tab] ? "" : "none"; return; }
  box.style.display = "";
  const row = el("div", { class: "row" });
  let cm, w;
  if (tab === "obstacle") {
    cm = el("input", { placeholder: "box distances cm, e.g. 20,50", style: "width:15em" });
    w = el("input", { placeholder: "box width mm", type: "number", style: "width:8em" });
    row.append(cm, w);
  }
  const btn = el("button", {}, "Run check");
  const out = el("div");
  btn.onclick = async () => {
    let q = "/api/check?kind=" + tab;
    if (cm && cm.value.trim()) q += "&expect_cm=" + encodeURIComponent(cm.value.trim());
    if (w && w.value.trim()) q += "&expect_width_mm=" + encodeURIComponent(w.value.trim());
    try {
      const vs = await api(q);
      const t = el("table");
      for (const v of vs) {
        const cls = v.result === "PASS" || v.result === "FAIL" ? v.result : "other";
        t.append(el("tr", {}, el("td", { class: "res " + cls }, v.result), el("td", {}, el("div", {}, v.name), el("div", { class: "note" }, v.detail))));
      }
      out.textContent = ""; out.append(t); showErr("");
    } catch (e) { showErr(e); }
  };
  row.append(btn, el("span", { class: "note" }, "PASS only when the data holds the measurement behind it."));
  box.append(el("h2", { style: "margin-top:10px" }, "Check"), row, out);
}
function renderPills() {
  const p = $("pills"); p.textContent = "";
  if (!lastState) return;
  const s = lastState.source;
  const add = (text, cls) => p.append(el("span", { class: "pill " + (cls || "") }, text));
  add("source: " + s.label + (s.running ? (s.live ? " (live)" : " (reading)") : " (stopped)"), s.running ? "ok" : "");
  add(s.lines + " lines, " + s.frames + " frames");
  if (s.live && s.data_age_s !== undefined) add("last data " + s.data_age_s + " s ago", s.data_age_s > 3 ? "bad" : "ok");
  if (s.live && s.hb_age_s !== undefined) add("last heartbeat " + s.hb_age_s + " s ago", s.hb_age_s > 3 ? "warn" : "ok");
  if (s.kind === "mqtt") add("broker " + (s.mqtt_connected ? "connected" : "NOT connected"), s.mqtt_connected ? "ok" : "bad");
  const vc = (lastState.readings.vc || []).find((r) => r.name === "VC state");
  if (vc && vc.value) add("VC " + vc.value);
  if (lastState.s1_ran) add("APP_TEST build with S1 self-tests: sensor values SIMULATED", "warn");
  else if (lastState.app_test) add("APP_TEST build", "warn");
  if (s.error) add("error: " + s.error, "bad");
}
function renderAll() { renderReadings(); renderFeed(); renderTest(); renderPills(); }

async function poll() {
  try {
    let st = await api("/api/state?since=" + seq);
    if (st.gen !== gen) {                    // a new source: start the feeds again from its first line
      resetFeeds(); gen = st.gen;
      st = await api("/api/state?since=0");
      if (st.gen !== gen) return;            // restarted again meanwhile: the next poll catches up
    }
    for (const k in st.feed) feeds[k].push(...st.feed[k]);
    feeds.console.push(...st.console);
    for (const k in feeds) if (feeds[k].length > FEED_LIMIT) feeds[k] = feeds[k].slice(-FEED_LIMIT);
    seq = st.seq;
    const up = st.source.kind === "mqtt" && !!st.source.mqtt_connected;
    const tabChanged = up !== mqttUp; mqttUp = up;
    lastState = st;
    renderReadings(); renderFeed(); renderPills();
    if (tabChanged && tab === "mqtt") renderTest();
  } catch (e) { $("pills").textContent = ""; $("pills").append(el("span", { class: "pill bad" }, "dashboard server not reachable")); }
}
async function loadLogs() {
  const sel = $("logSel"), keep = sel.value;
  const logs = await api("/api/logs");
  sel.textContent = ""; sel.append(el("option", { value: "" }, "(choose a log)"));
  for (const l of logs) sel.append(el("option", { value: l.path }, l.mtime + "  " + l.path));
  sel.value = keep;
}
async function setSource(body) {
  try { await api("/api/source", body); showErr(""); } catch (e) { showErr(e); }
}
$("openBtn").onclick = () => { if ($("logSel").value) setSource({ type: "file", path: $("logSel").value, follow: $("follow").checked }); };
$("refreshBtn").onclick = () => loadLogs().catch(showErr);
$("usbBtn").onclick = () => setSource({ type: "usb", seconds: 60 * (parseInt($("usbMin").value, 10) || 30) });
$("mqttBtn").onclick = () => { if ($("broker").value.trim()) setSource({ type: "mqtt", broker: $("broker").value.trim(), port: parseInt($("port").value, 10) || 1883 }); };
$("stopBtn").onclick = () => api("/api/source", { type: "stop" }).catch(showErr);

if (TABS.some(([k]) => "#" + k === location.hash)) tab = location.hash.slice(1);
renderTabs(); renderAll(); loadLogs().catch(showErr); poll(); setInterval(poll, 500);
</script>
</body>
</html>
